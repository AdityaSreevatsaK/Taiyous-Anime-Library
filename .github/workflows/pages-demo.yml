name: Publish synthetic Anime Library preview

# Preview publishing is intentionally opt-in after the initial workflow addition.
# Later source updates do not automatically publish personal data.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-synthetic-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refuse to publish without the synthetic demo markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'FICTIONAL synthetic fixtures' src/data/catalogue.ts
          grep -Fq 'Synthetic demo' src/App.tsx
          if git ls-files | grep -Ei '\.(epub|mp4|mov|mkv|avi|zip|pem|key)$'; then
            echo 'Unexpected private media or credential-like file in repository'
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -- --base=/Taiyous-Anime-Library/
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
